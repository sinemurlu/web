
    <!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hakkımda</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #ecf1f4;
        }

        .cizgi {
            width: 80%;
            margin: 30px auto 0;
            border-bottom: 3px solid #2b70bb;
            padding-bottom: 5px;
        }

        .cizgi h2 {
            margin: 0;
            padding-bottom: 10px;
            color: #2b70bb;
        }

        .altbolum {
            background-color: white;
            color: black;
            margin: 30px auto;
            padding: 20px;
            width: 80%;
            border-radius: 15px;
        }

        .altbolum p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="cizgi">
        <h2>Hakkımda</h2>
    </div>

    <div class="altbolum">
        <p>
            Merhaba! Ben Ayşe. Bilgisayar Programcılığı bölümünde okuyorum ve
            <strong>web tasarımı</strong> öğreniyorum. Bu sayfayı HTML ve CSS
            dersinde öğrendiklerimi kullanarak hazırladım.
        </p>

        <p>
            Boş zamanlarımda kitap okumayı, fotoğraf çekmeyi ve yeni şeyler
            öğrenmeyi seviyorum.
        </p>
    </div>

</body>
</html>
